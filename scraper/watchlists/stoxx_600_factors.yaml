corpus: stoxx_600_factors
description: |
  Factor-model live corpus. Curated diverse subset of STOXX Europe 600
  (30 tickers across pharma, tech, banks, industrials, energy, consumer,
  telecoms, chemicals) chosen to:
    - fit within a 60-min GitHub Actions run at 3 articles/ticker
    - span sectors and countries so KMeans/PCA has variance to work with
    - overlap with the local factor-preview script (so behaviour is comparable)
  Extraction uses the enriched prompt (sentiment / materiality / event_type
  on every triplet). Downstream: computes daily factor loadings per entity
  and writes them to sources/stoxx_600_factors/factors/YYYY-MM-DD.json.

sources:
  - google_news

# 30 tickers, ~5 per sector.
