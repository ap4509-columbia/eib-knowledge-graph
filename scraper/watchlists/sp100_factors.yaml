corpus: sp100_factors
description: |
  Factor-model live corpus — US counterpart of stoxx_600_factors.
  Curated 30-ticker subset of the S&P 100 (mega-caps across six sectors),
  same design budget as the STOXX list: 3 articles/ticker/day, enriched
  extraction (sentiment / materiality / event_type per triplet), daily
  factor loadings + PCA + KMeans, GAT predictions once months accumulate.
  Keep frontend/lib/sectors.ts in sync when editing this list.

sources:
  - google_news

# 30 tickers, ~5 per sector.
