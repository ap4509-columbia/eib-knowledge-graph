corpus: sp100_factors
description: |
  Factor-model live corpus — US counterpart of stoxx_600_factors.
  Full S&P 100 constituent list (~101 tickers; GOOG dual-class dropped in
  favor of GOOGL), same design budget as the STOXX list: 3 articles per
  ticker per day, enriched extraction (sentiment / materiality /
  event_type per triplet), daily factor loadings + PCA + KMeans, GAT
  predictions once months accumulate.
  Keep frontend/lib/sectors.ts in sync when editing this list.

sources:
  - google_news

