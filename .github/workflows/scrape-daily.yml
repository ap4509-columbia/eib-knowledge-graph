name: Daily corpus refresh

on:
  schedule:
    # Every day at 06:00 UTC. Adjust cadence here if you want it more/less frequent.
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Adds a "Run workflow" button in the Actions tab for manual triggers.
    inputs:
      watchlist:
        description: 'Optional single watchlist to run (e.g. us_semis). Leave blank for all.'
        required: false
        default: ''

concurrency:
  group: scrape-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use PAT-free push via GITHUB_TOKEN; fetch full history for a clean diff
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.watchlist }}" ]; then
            python scraper/run_daily.py "${{ github.event.inputs.watchlist }}"
          else
            python scraper/run_daily.py
          fi

      - name: Commit new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data scraper/state
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "chore: daily corpus refresh $(date -u +%Y-%m-%d)"
          git push
